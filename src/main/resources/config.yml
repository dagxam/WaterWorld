# WaterWorld 2.1

sea-level: 63

ocean:
  base-height: 35
  height-amplitude: 12
  terrain-scale: 0.005
  cave-scale: 0.015
  cave-threshold: 0.64
  cave-roof: 8

island:
  enabled: true

  # Center of the only island.
  center-x: 0
  center-z: 0

  # Dry land radius. About 32 blocks across.
  radius: 16

  # Full island + underwater gradual slope.
  # About 58 blocks across.
  slope-radius: 29

  # Height above sea level.
  height: 7

  # Small natural height variation.
  variation: 1.2

  # Controls gentle surface variation.
  noise-scale: 0.07

  # Actual dry island biome.
  biome: PLAINS
