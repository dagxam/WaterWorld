# ==========================================================
# WaterWorld — настройки мира
# ==========================================================

sea-level: 63

ocean:
  base-height: 35
  height-amplitude: 12
  terrain-scale: 0.005
  cave-scale: 0.015
  cave-threshold: 0.64
  cave-roof: 8

# ==========================================================
# ГЛАВНЫЙ ОСТРОВ
# ==========================================================
island:
  enabled: true
  center-x: 0
  center-z: 0
  radius: 100
  slope-radius: 132
  height: 10
  variation: 2.2
  noise-scale: 0.045
  biome: PLAINS

  # ========================================================
  # НЕБОЛЬШОЙ ЗЕЛЁНЫЙ ХОЛМ
  # ========================================================
  mountain:
    enabled: true
    offset-x: 0
    offset-z: -22
    radius: 38
    peak-height: 92
    snow-line: 120
    secondary-peaks: false

    # Небольшая тёмная пещерная система внутри холма.
    # В ней сохраняется ванильный спавн враждебных мобов.
    cave:
      enabled: true

# ==========================================================
# РАСТИТЕЛЬНОСТЬ
# ==========================================================
vegetation:
  enabled: true
  attempts-per-chunk: 16
  tree-chance-percent: 22
  flower-chance-percent: 38

# ==========================================================
# НЕБОЛЬШАЯ ДЕРЕВНЯ
# ==========================================================
village:
  enabled: true
  offset-x: 0
  offset-z: 55

# ==========================================================
# ЖИВОТНЫЕ И МОРСКИЕ МОБЫ
# ==========================================================
animals:
  enabled: true
  ocean-radius: 280

# ==========================================================
# РУДЫ
# ==========================================================
# Генерация остаётся внутри камня острова, холма и под океаном.
# Пещера вырезается после холма, поэтому открывает уже сгенерированные жилы.
ores:
  enabled: true
  attempts-per-chunk: 64
