# ==========================================================
# WaterWorld — настройки мира
# ==========================================================

# Плагин сам создаёт этот отдельный мир через стандартный Bukkit WorldCreator.
# Не нужно указывать генератор вручную в server.properties или Multiverse.
world:
  name: waterworld

sea-level: 63

ocean:
  base-height: 35
  height-amplitude: 12
  terrain-scale: 0.005
  cave-scale: 0.015
  cave-threshold: 0.64
  cave-roof: 8

# ==========================================================
# ГЛАВНЫЙ ОСТРОВ
# ==========================================================
island:
  enabled: true
  center-x: 0
  center-z: 0
  radius: 100
  slope-radius: 132
  height: 10
  variation: 2.2
  noise-scale: 0.045
  biome: PLAINS

  mountain:
    enabled: true
    offset-x: 0
    offset-z: -22
    radius: 38
    peak-height: 92
    snow-line: 120
    secondary-peaks: false
    cave:
      enabled: true

# ==========================================================
# ДОПОЛНИТЕЛЬНЫЕ ОСТРОВА
# ==========================================================
# Каждый остров получает тот же естественный рельеф, берег,
# траву, цветы, деревья и обычную ванильную живность.
additional-islands:
  count: 1
  radius: 64
  min-distance: 180
  max-distance: 420

# ==========================================================
# РАСТИТЕЛЬНОСТЬ
# ==========================================================
vegetation:
  enabled: true
  attempts-per-chunk: 16
  tree-chance-percent: 22
  flower-chance-percent: 38

# ==========================================================
# НЕБОЛЬШАЯ ДЕРЕВНЯ НА ГЛАВНОМ ОСТРОВЕ
# ==========================================================
village:
  enabled: true
  offset-x: 0
  offset-z: 55

# ==========================================================
# ЖИВОТНЫЕ И МОРСКИЕ МОБЫ
# ==========================================================
animals:
  enabled: true
  ocean-radius: 600

# Руды WaterWorld не генерирует. Единственная система генерации руд — Ore-Plugin.
