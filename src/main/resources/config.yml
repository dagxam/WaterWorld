# ==========================================================
# WaterWorld 3.4 — fixed archipelago, villages, treasures, living ocean
# ==========================================================
world:
  name: waterworld

sea-level: 62

spawn:
  preload-chunk-radius: 4

time-cycle:
  enabled: true
  day-duration-seconds: 600
  night-duration-seconds: 600
  update-interval-ticks: 20

# Calm sandy ocean. The floor stays well below the surface and is decorated separately.
ocean:
  base-height: 34
  height-amplitude: 5
  terrain-scale: 0.004

# Caves remain disabled so they do not create ugly holes or dark voids under the ocean.
caves:
  enabled: false

# Main island: about 300x300 blocks, with one compact elongated mountain massif.
island:
  enabled: true
  center-x: 0
  center-z: 0
  radius: 150
  slope-radius: 24
  height: 18
  variation: 2.0
  noise-scale: 0.022
  mountain:
    enabled: true
    offset-x: 0
    offset-z: -24
    radius: 58
    stretch-x: 1.35
    stretch-z: 0.72
    peak-height: 158
    snow-line: 128

# Exactly two fixed green islands. No random islands and no rocky-island type.
additional-islands:
  count: 2
  forest:
    x: 0
    z: -220
    radius: 35
  tropical:
    x: 170
    z: 190
    radius: 30

vegetation:
  enabled: true
  attempts-per-chunk: 10
  tree-chance-percent: 18
  flower-chance-percent: 32

# Dense, colorful and varied living ocean floor.
ocean-life:
  enabled: true
  attempts-per-chunk: 32
  seagrass-chance-percent: 58
  kelp-chance-percent: 24
  coral-chance-percent: 18
  meadow-chance-percent: 18
  magma-vent-chance-percent: 2

village:
  enabled: true
  min-island-radius: 24
  additional-island-chance: 1.0

treasures:
  enabled: true
  min-per-island: 1
  max-per-island: 3

animals:
  enabled: true
  ocean-radius: 900
