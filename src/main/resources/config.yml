# ==========================================================
# WaterWorld — настройки мира
# ==========================================================

sea-level: 63

ocean:
  base-height: 35
  height-amplitude: 12
  terrain-scale: 0.005
  cave-scale: 0.015
  cave-threshold: 0.64
  cave-roof: 8

# ==========================================================
# ГЛАВНЫЙ ОСТРОВ
# ==========================================================
island:
  enabled: true
  center-x: 0
  center-z: 0

  # Большая суша: примерно 200x200 блоков.
  radius: 100

  # Плавный подводный склон: примерно 264x264 блоков.
  slope-radius: 132

  height: 10
  variation: 2.2
  noise-scale: 0.045
  biome: PLAINS

  # ========================================================
  # БОЛЬШАЯ ГЛАВНАЯ ГОРА
  # ========================================================
  mountain:
    enabled: true

    # Гора расположена ближе к дальней части острова.
    offset-x: 0
    offset-z: -22

    # Широкое основание для плавного подъёма.
    radius: 66

    # Абсолютная высота вершины.
    peak-height: 145

    # С этой высоты верх горы покрывается снегом.
    snow-line: 108

    # Две небольшие боковые вершины делают силуэт естественным.
    secondary-peaks: true

  # Малые острова полностью отключены.
  satellites:
    enabled: false
    count: 0

  vegetation:
    enabled: true
    attempts-per-chunk: 12
    tree-chance-percent: 18
    flower-chance-percent: 34

  # Мобы не создаются вручную — работает ванильный Minecraft.
  animals:
    enabled: false

ores:
  enabled: true
  attempts-per-chunk: 64
