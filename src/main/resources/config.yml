# ==========================================================
# WaterWorld — архипелаг: зелёный главный остров + 2 малых острова
# ==========================================================

world:
  name: waterworld

sea-level: 63

time-cycle:
  enabled: true
  day-duration-seconds: 600
  night-duration-seconds: 600
  update-interval-ticks: 1

ocean:
  base-height: 35
  height-amplitude: 8
  terrain-scale: 0.005

island:
  enabled: true
  center-x: 0
  center-z: 0
  radius: 100
  height: 10
  variation: 1.8
  noise-scale: 0.045
  biome: PLAINS

  # ВАЖНО: это именно широкий невысокий холм, не каменная гора.
  central-hill:
    height: 9
    radius: 42
    offset-x: 0
    offset-z: -12

# Ровно два малых острова. Они фиксированы и находятся далеко от главного.
# Никаких случайных каменных островов генератор больше не создаёт.
additional-islands:
  count: 2
  radius: 28
  height: 5
  variation: 1.0
  min-distance: 240
  max-distance: 420
  islands:
    forest:
      enabled: true
      x: 0
      z: -300
      radius: 28
      height: 5
      variation: 1.0
    tropical:
      enabled: true
      x: 240
      z: 280
      radius: 24
      height: 4
      variation: 0.8

vegetation:
  enabled: true
  attempts-per-chunk: 16
  tree-chance-percent: 22
  flower-chance-percent: 38

village:
  enabled: true
  offset-x: 0
  offset-z: 55

animals:
  enabled: true
  ocean-radius: 600

# Руды WaterWorld не генерирует. Единственная система генерации руд — BedrockOres/Ore-Plugin.
