# ==========================================================
# WaterWorld — настройки мира
# ==========================================================

sea-level: 63

ocean:
  base-height: 35
  height-amplitude: 12
  terrain-scale: 0.005
  cave-scale: 0.015
  cave-threshold: 0.64
  cave-roof: 8

# ==========================================================
# ГЛАВНЫЙ ОСТРОВ
# ==========================================================
island:
  enabled: true
  center-x: 0
  center-z: 0

  # Большая равнина: примерно 200x200 блоков суши.
  radius: 100

  # Плавный подводный склон: примерно 264x264 блоков.
  slope-radius: 132

  height: 10
  variation: 2.2
  noise-scale: 0.045
  biome: PLAINS

  # ========================================================
  # НЕБОЛЬШОЙ ЗЕЛЁНЫЙ ХОЛМ
  # ========================================================
  mountain:
    enabled: true
    offset-x: 0
    offset-z: -22
    radius: 38
    peak-height: 92

    # Выше вершины холма — снег не появляется.
    # Поэтому поверхность остаётся дерном.
    snow-line: 120
    secondary-peaks: false

# ==========================================================
# РАСТИТЕЛЬНОСТЬ
# ==========================================================
vegetation:
  enabled: true
  attempts-per-chunk: 16
  tree-chance-percent: 22
  flower-chance-percent: 38

# ==========================================================
# НЕБОЛЬШАЯ ДЕРЕВНЯ
# ==========================================================
# Если на выбранном месте достаточно ровной равнины,
# создаётся небольшая деревня. Если места нет — пропускается.
village:
  enabled: true
  offset-x: 0
  offset-z: 55

# Животные вручную НЕ создаются.
# Пассивные и враждебные мобы используют стандартный Minecraft.
animals:
  enabled: false

# ==========================================================
# РУДЫ
# ==========================================================
# Для кастомного генератора руды создаются детерминированными
# жилами внутри камня острова, холма и подводного дна.
ores:
  enabled: true
  attempts-per-chunk: 64
