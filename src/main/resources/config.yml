# ==========================================================
# WaterWorld — настройки мира
# ==========================================================

# Уровень моря.
sea-level: 63

# ==========================================================
# ОКЕАН
# ==========================================================
ocean:
  base-height: 35
  height-amplitude: 12
  terrain-scale: 0.005
  cave-scale: 0.015
  cave-threshold: 0.64
  cave-roof: 8

# ==========================================================
# ГЛАВНЫЙ ОСТРОВ
# ==========================================================
island:
  enabled: true
  center-x: 0
  center-z: 0

  # Сухая часть: примерно 180x180 блоков.
  # Большого пространства достаточно для равнины и горы.
  radius: 90

  # Полная зона с плавным подводным склоном: примерно 240x240.
  slope-radius: 120

  # Небольшая общая высота равнины.
  height: 9
  variation: 1.6
  noise-scale: 0.07
  biome: PLAINS

  # ========================================================
  # БОЛЬШАЯ ГОРА
  # ========================================================
  mountain:
    enabled: true

    # Смещение вершины относительно центра острова.
    offset-x: 18
    offset-z: 8

    # Радиус основания горы.
    radius: 48

    # Высота вершины. При sea-level 63 вершина около Y125.
    peak-height: 125

  # Малые острова полностью отключены.
  satellites:
    enabled: false
    count: 0

  # ========================================================
  # РАСТИТЕЛЬНОСТЬ И ДЕРЕВЬЯ
  # ========================================================
  vegetation:
    enabled: true
    attempts-per-chunk: 9
    tree-chance-percent: 16
    flower-chance-percent: 32

  # Животные вручную НЕ создаются.
  # Пассивные и враждебные мобы полностью спавнятся
  # стандартной системой Minecraft.
  animals:
    enabled: false

# ==========================================================
# РУДЫ
# ==========================================================
# Руды генерируются непосредственно WaterWorld, поскольку
# стандартная генерация шума отключена кастомным генератором.
# Работает и в острове, и под океаном.
ores:
  enabled: true
  attempts-per-chunk: 64
