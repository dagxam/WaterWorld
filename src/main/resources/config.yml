# ==========================================================
# WaterWorld — настройки мира
# ==========================================================

# Уровень моря.
sea-level: 63

# ==========================================================
# ОКЕАН
# ==========================================================
ocean:
  base-height: 35
  height-amplitude: 12
  terrain-scale: 0.005
  cave-scale: 0.015
  cave-threshold: 0.64
  cave-roof: 8

# ==========================================================
# ГЛАВНЫЙ ОСТРОВ
# ==========================================================
island:
  enabled: true

  # Центр главного острова.
  center-x: 0
  center-z: 0

  # Сухая часть: радиус 48 = примерно 96x96 блоков.
  radius: 48

  # Полная зона главного острова вместе с плавным подводным склоном.
  # Радиус 72 = примерно 144x144 блоков.
  slope-radius: 72

  # Высота главного острова над уровнем моря.
  height: 9
  variation: 1.6
  noise-scale: 0.07
  biome: PLAINS

  # ========================================================
  # ПЯТЬ МАЛЫХ ОСТРОВОВ ВОКРУГ
  # ========================================================
  satellites:
    enabled: true
    count: 5
    distance: 130
    min-radius: 12
    max-radius: 19
    slope-radius: 30
    height: 6

  # ========================================================
  # РАСТИТЕЛЬНОСТЬ И ДЕРЕВЬЯ
  # ========================================================
  vegetation:
    enabled: true
    attempts-per-chunk: 9
    tree-chance-percent: 16
    flower-chance-percent: 32

  # Животные вручную НЕ создаются.
  # Пассивные и враждебные мобы полностью спавнятся
  # стандартной системой Minecraft.
  animals:
    enabled: false

# ==========================================================
# РУДЫ
# ==========================================================
ores:
  enabled: true
  attempts-per-chunk: 64
