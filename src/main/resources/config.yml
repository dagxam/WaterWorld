# ==========================================================
# WaterWorld — настройки мира
# ==========================================================

# Плагин сам создаёт этот отдельный мир через стандартный Bukkit WorldCreator.
world:
  name: waterworld

sea-level: 63

# ==========================================================
# ВРЕМЯ СУТОК
# Продолжительность указывается в секундах реального времени.
# 0 или меньше — оставить стандартную скорость Minecraft.
# День: от 0 до 12000 игровых тиков.
# Ночь: от 12000 до 24000 игровых тиков.
# По умолчанию: день 10 минут, ночь 10 минут.
# ==========================================================
time-cycle:
  enabled: true
  day-duration-seconds: 600
  night-duration-seconds: 600

  # Как часто плагин обновляет время мира.
  # Меньшее значение даёт более плавный ход времени.
  update-interval-ticks: 1

ocean:
  base-height: 35
  height-amplitude: 12
  terrain-scale: 0.005
  cave-scale: 0.015
  cave-threshold: 0.64
  cave-roof: 8

island:
  enabled: true
  center-x: 0
  center-z: 0
  radius: 100
  slope-radius: 132
  height: 10
  variation: 2.2
  noise-scale: 0.045
  biome: PLAINS

  mountain:
    enabled: true
    offset-x: 0
    offset-z: -22
    radius: 38
    peak-height: 92
    snow-line: 120
    secondary-peaks: false
    cave:
      enabled: true

additional-islands:
  count: 1
  radius: 64
  min-distance: 180
  max-distance: 420

vegetation:
  enabled: true
  attempts-per-chunk: 16
  tree-chance-percent: 22
  flower-chance-percent: 38

village:
  enabled: true
  offset-x: 0
  offset-z: 55

animals:
  enabled: true
  ocean-radius: 600

# Руды WaterWorld не генерирует. Единственная система генерации руд — Ore-Plugin.
