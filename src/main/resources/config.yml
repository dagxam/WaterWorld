# ==========================================================
# WaterWorld 3.1 — optimized islands, villages and treasures
# ==========================================================
world:
  name: waterworld

sea-level: 63

spawn:
  preload-chunk-radius: 3

time-cycle:
  enabled: true
  day-duration-seconds: 600
  night-duration-seconds: 600
  update-interval-ticks: 20

ocean:
  base-height: 35
  height-amplitude: 12
  terrain-scale: 0.005
  cave-scale: 0.018
  cave-threshold: 0.70

caves:
  enabled: true

island:
  enabled: true
  center-x: 0
  center-z: 0
  radius: 100
  slope-radius: 42
  height: 14
  variation: 2.8
  noise-scale: 0.035
  mountain:
    enabled: true
    offset-x: 0
    offset-z: -22
    radius: 48
    stretch-x: 1.55
    stretch-z: 0.85
    peak-height: 118
    snow-line: 102

additional-islands:
  count: 3
  min-radius: 32
  max-radius: 72
  min-distance: 180
  max-distance: 520

vegetation:
  enabled: true
  attempts-per-chunk: 10
  tree-chance-percent: 18
  flower-chance-percent: 32

# The main island always gets a village if terrain allows it.
# Large secondary islands get one according to the chance below.
village:
  enabled: true
  min-island-radius: 48
  additional-island-chance: 0.55

treasures:
  enabled: true
  # Each island receives a deterministic number of hidden barrels.
  min-per-island: 1
  max-per-island: 3

animals:
  enabled: true
  ocean-radius: 600
