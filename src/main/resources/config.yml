# ==========================================================
# WaterWorld 3.0 — optimized world generation
# ==========================================================
world:
  name: waterworld

sea-level: 63

spawn:
  # 3 = 7x7 chunks, generated only once at startup.
  preload-chunk-radius: 3

time-cycle:
  enabled: true
  day-duration-seconds: 600
  night-duration-seconds: 600
  # 20 ticks = one update per second instead of every tick.
  update-interval-ticks: 20

ocean:
  base-height: 35
  height-amplitude: 12
  terrain-scale: 0.005
  cave-scale: 0.018
  cave-threshold: 0.70

caves:
  enabled: true

island:
  enabled: true
  center-x: 0
  center-z: 0
  radius: 100
  # Extra width of the smooth transition from island to ocean.
  slope-radius: 42
  height: 14
  variation: 2.8
  noise-scale: 0.035

  mountain:
    enabled: true
    offset-x: 0
    offset-z: -22
    # Base radius before stretching.
    radius: 48
    stretch-x: 1.55
    stretch-z: 0.85
    peak-height: 118
    snow-line: 102

additional-islands:
  count: 3
  min-radius: 32
  max-radius: 72
  min-distance: 180
  max-distance: 520

vegetation:
  enabled: true
  attempts-per-chunk: 10
  tree-chance-percent: 18
  flower-chance-percent: 32

village:
  enabled: true
  offset-x: 0
  offset-z: 55

animals:
  enabled: true
  ocean-radius: 600
