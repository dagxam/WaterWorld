# ==========================================================
# WaterWorld — настройки мира
# ==========================================================

# Уровень моря.
sea-level: 63

# ==========================================================
# ОКЕАН
# ==========================================================
ocean:
  # Средняя высота морского дна.
  base-height: 35

  # Насколько меняется глубина дна.
  height-amplitude: 12

  # Масштаб крупных неровностей дна.
  terrain-scale: 0.005

  # Масштаб подводных пещер.
  cave-scale: 0.015

  # Порог появления пещер.
  cave-threshold: 0.64

  # Минимальная толщина породы над пещерами.
  cave-roof: 8

# ==========================================================
# ЕДИНСТВЕННЫЙ ОСТРОВ
# ==========================================================
island:
  enabled: true

  # Центр острова.
  center-x: 0
  center-z: 0

  # Радиус сухой части.
  # 32 блока = примерно 64 блока в диаметре.
  radius: 32

  # Радиус всей зоны острова вместе с подводным склоном.
  # Подводный склон продолжается ещё на 16 блоков.
  slope-radius: 48

  # Высота острова над уровнем моря.
  height: 9

  # Естественная неровность поверхности.
  variation: 1.6

  # Масштаб неровностей поверхности.
  noise-scale: 0.07

  # Сухая часть острова использует равнинный биом.
  biome: PLAINS

  # ========================================================
  # РАСТИТЕЛЬНОСТЬ И ДЕРЕВЬЯ
  # ========================================================
  vegetation:
    enabled: true
    attempts-per-chunk: 9
    tree-chance-percent: 16
    flower-chance-percent: 32

  # ========================================================
  # ЖИВОТНЫЕ
  # ========================================================
  animals:
    enabled: true

    # Максимальное количество животных на всём острове.
    max-total: 20

    # Сколько животных пытаемся добавить при генерации чанка.
    per-chunk: 2

    # Используемые животные:
    # коровы, овцы, свиньи и куры.
