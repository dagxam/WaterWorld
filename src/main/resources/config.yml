# ==========================================================
# WaterWorld — настройки мира
# ==========================================================

sea-level: 63

ocean:
  base-height: 35
  height-amplitude: 12
  terrain-scale: 0.005
  cave-scale: 0.015
  cave-threshold: 0.64
  cave-roof: 8

# ==========================================================
# ГЛАВНЫЙ ОСТРОВ
# ==========================================================
island:
  enabled: true
  center-x: 0
  center-z: 0

  # Большая равнина: примерно 200x200 блоков суши.
  radius: 100

  # Плавный подводный склон: примерно 264x264 блоков.
  slope-radius: 132

  height: 10
  variation: 2.2
  noise-scale: 0.045
  biome: PLAINS

  # ========================================================
  # НЕБОЛЬШОЙ ЗЕЛЁНЫЙ ХОЛМ
  # ========================================================
  mountain:
    enabled: true
    offset-x: 0
    offset-z: -22
    radius: 38
    peak-height: 92

    # Выше вершины холма — снег не появляется.
    # Поэтому поверхность остаётся дерном.
    snow-line: 120
    secondary-peaks: false

# ==========================================================
# РАСТИТЕЛЬНОСТЬ
# ==========================================================
vegetation:
  enabled: true
  attempts-per-chunk: 16
  tree-chance-percent: 22
  flower-chance-percent: 38

# ==========================================================
# НЕБОЛЬШАЯ ДЕРЕВНЯ
# ==========================================================
village:
  enabled: true
  offset-x: 0
  offset-z: 55

# ==========================================================
# ЖИВОТНЫЕ И МОРСКИЕ МОБЫ
# ==========================================================
# Основной естественный спавн Minecraft сохраняется.
# Плагин только балансирует количество животных на острове
# и добавляет редких животных/морских мобов, которых здесь мало.
animals:
  enabled: true

  # Радиус океана, в котором плагин поддерживает морскую живность.
  ocean-radius: 280

  # Свиней специально мало; овец, коров и кур больше.
  # Лимиты видов находятся в MobDecorator.java.

# ==========================================================
# РУДЫ
# ==========================================================
ores:
  enabled: true
  attempts-per-chunk: 64
