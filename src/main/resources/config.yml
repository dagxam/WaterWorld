# ==========================================================
# WaterWorld — настройки мира
# ==========================================================

# Уровень моря.
sea-level: 63

# ==========================================================
# ОКЕАН
# ==========================================================
ocean:
  base-height: 35
  height-amplitude: 12
  terrain-scale: 0.005
  cave-scale: 0.015
  cave-threshold: 0.64
  cave-roof: 8

# ==========================================================
# ЕДИНСТВЕННЫЙ ОСТРОВ
# ==========================================================
island:
  enabled: true

  # Центр острова.
  center-x: 0
  center-z: 0

  # Сухая часть: радиус 48 = примерно 96x96 блоков.
  radius: 48

  # Полная зона острова вместе с плавным подводным склоном.
  # Радиус 72 = примерно 144x144 блоков.
  slope-radius: 72

  # Высота острова над уровнем моря.
  height: 9
  variation: 1.6
  noise-scale: 0.07
  biome: PLAINS

  vegetation:
    enabled: true
    attempts-per-chunk: 9
    tree-chance-percent: 16
    flower-chance-percent: 32

  # Животные вручную НЕ создаются.
  # Животных и враждебных мобов полностью спавнит
  # стандартная система Minecraft.
  animals:
    enabled: false

# ==========================================================
# РУДЫ
# ==========================================================
ores:
  enabled: true
  attempts-per-chunk: 64
