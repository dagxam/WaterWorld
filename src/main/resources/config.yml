# ==========================================================
# WaterWorld — один главный зелёный остров + случайные малые острова
# ==========================================================

world:
  name: waterworld

sea-level: 63

time-cycle:
  enabled: false
  day-duration-seconds: 1200
  night-duration-seconds: 600
  update-interval-ticks: 1

ocean:
  base-height: 35
  height-amplitude: 3
  terrain-scale: 0.004

ocean-life:
  enabled: true
  plant-attempts-per-chunk: 44
  reef-chance-percent: 42
  ruin-chance-percent: 9
  shipwreck-chance-percent: 4

island:
  enabled: true
  center-x: 0
  center-z: 0
  radius: 100
  height: 9
  variation: 1.2
  noise-scale: 0.035
  biome: PLAINS
  mountain:
    enabled: false
  central-hill:
    height: 7
    radius: 48
    offset-x: 0
    offset-z: -12

# Автономные малые острова.
# Они не создаются заранее списком: при генерации каждого чанка
# вычисляются только ближайшие кандидаты. Координаты детерминированы
# seed + ячейкой, поэтому созданный остров всегда остаётся на том же месте.
additional-islands:
  enabled: true
  # Шанс появления острова в одной пространственной ячейке.
  chance-percent: 100
  # Средний шаг сетки между возможными островами.
  # Система автоматически увеличит его при необходимости,
  # чтобы острова не подходили друг к другу ближе min-distance.
  cell-size: 650
  # Минимальная дистанция между центрами малых островов.
  min-distance: 500
  radius-min: 18
  radius-max: 30
  height-min: 3
  height-max: 5
  variation: 0.7

vegetation:
  enabled: true
  attempts-per-chunk: 16
  tree-chance-percent: 22
  flower-chance-percent: 38

village:
  enabled: true
  offset-x: 0
  offset-z: 55

animals:
  enabled: true
  ocean-radius: 600

# ==========================================================
# Восстановление разрушенного рельефа
# ==========================================================
restore:
  # Радиус команды /wwrestore без аргумента.
  radius: 32
  # Максимальный разрешённый радиус команды.
  max-radius: 64
  # Сохранять историю между перезапусками сервера.
  persistent: true

# Руды генерируются отдельной системой WaterWorld в Stone и Deepslate.
