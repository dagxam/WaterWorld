# ==========================================================
# WaterWorld 3.6 — wider archipelago, smaller main mountain, rich living ocean
# ==========================================================
world:
  name: waterworld

sea-level: 62

spawn:
  preload-chunk-radius: 4

time-cycle:
  enabled: true
  day-duration-seconds: 600
  night-duration-seconds: 600
  update-interval-ticks: 20

ocean:
  base-height: 34
  height-amplitude: 5
  terrain-scale: 0.004

caves:
  enabled: false

# Main island remains about 300x300 blocks. The mountain is deliberately smaller,
# lower and more compact so green land, beaches and the village stay visually dominant.
island:
  enabled: true
  center-x: 0
  center-z: 0
  radius: 150
  slope-radius: 24
  height: 18
  variation: 2.0
  noise-scale: 0.022
  mountain:
    enabled: true
    offset-x: 0
    offset-z: -18
    radius: 42
    stretch-x: 1.28
    stretch-z: 0.78
    peak-height: 140
    snow-line: 118

# Exactly two fixed green islands. They are moved farther away from the main island
# so there is a broad ocean gap and the archipelago feels more open.
additional-islands:
  count: 2
  forest:
    x: 0
    z: -300
    radius: 35
  tropical:
    x: 240
    z: 280
    radius: 30

vegetation:
  enabled: true
  attempts-per-chunk: 10
  tree-chance-percent: 18
  flower-chance-percent: 32

# IMPORTANT: ocean decoration scans down to the actual seabed, so plants and coral
# are no longer skipped because getHighestBlockYAt() returns the water surface.
ocean-life:
  enabled: true
  attempts-per-chunk: 40
  seagrass-chance-percent: 62
  kelp-chance-percent: 28
  coral-chance-percent: 24
  meadow-chance-percent: 24
  magma-vent-chance-percent: 2

# Rare handcrafted-style points of interest on the ocean floor.
ocean-structures:
  chance-percent: 4
  shipwreck-percent: 50
  ruin-percent: 50

village:
  enabled: true
  min-island-radius: 24
  additional-island-chance: 1.0

treasures:
  enabled: true
  min-per-island: 1
  max-per-island: 3

animals:
  enabled: true
  ocean-radius: 900
