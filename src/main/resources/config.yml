
# ==========================================================
# WaterWorld — один главный зелёный остров + два малых острова
# ==========================================================

world:
  name: waterworld

sea-level: 63

time-cycle:
  enabled: true
  day-duration-seconds: 600
  night-duration-seconds: 600
  update-interval-ticks: 1

# Океан должен быть спокойным: без каменных материков и огромных подводных гор.
ocean:
  base-height: 35
  height-amplitude: 3
  terrain-scale: 0.004

# Отдельная система живого океанского дна.
# v2 декорирует дно только после полной генерации чанка и заполняет также старые пустые чанки.
ocean-life:
  enabled: true
  plant-attempts-per-chunk: 44
  reef-chance-percent: 42
  ruin-chance-percent: 9
  shipwreck-chance-percent: 4

island:
  enabled: true
  center-x: 0
  center-z: 0
  radius: 100
  height: 9
  variation: 1.2
  noise-scale: 0.035
  biome: PLAINS

  # Старый каменный генератор гор полностью выключен.
  mountain:
    enabled: false

  # Только широкий зелёный холм в центре, без острых вершин и снега.
  central-hill:
    height: 7
    radius: 48
    offset-x: 0
    offset-z: -12

# Ровно два небольших зелёных острова, далеко от главного.
additional-islands:
  count: 2
  radius: 26
  height: 4
  variation: 0.7
  min-distance: 260
  max-distance: 420
  islands:
    forest:
      enabled: true
      x: 0
      z: -320
      radius: 26
      height: 4
      variation: 0.7
    tropical:
      enabled: true
      x: 280
      z: 300
      radius: 22
      height: 3
      variation: 0.6

vegetation:
  enabled: true
  attempts-per-chunk: 16
  tree-chance-percent: 22
  flower-chance-percent: 38

village:
  enabled: true
  offset-x: 0
  offset-z: 55

animals:
  enabled: true
  ocean-radius: 600

# Руды WaterWorld не генерирует. Единственная система генерации руд — BedrockOres/Ore-Plugin.
