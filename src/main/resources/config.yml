# ==========================================================
# WaterWorld — один главный зелёный остров + случайные малые острова
# ==========================================================

world:
  name: waterworld

sea-level: 63

time-cycle:
  enabled: false
  day-duration-seconds: 1200
  night-duration-seconds: 600
  update-interval-ticks: 1

ocean:
  base-height: 35
  height-amplitude: 3
  terrain-scale: 0.004

ocean-life:
  enabled: true
  plant-attempts-per-chunk: 44
  reef-chance-percent: 42
  ruin-chance-percent: 9
  shipwreck-chance-percent: 4

island:
  enabled: true
  center-x: 0
  center-z: 0
  radius: 100
  height: 9
  variation: 1.2
  noise-scale: 0.035
  biome: PLAINS
  mountain:
    enabled: false
  central-hill:
    height: 7
    radius: 48
    offset-x: 0
    offset-z: -12

# 10–20 небольших островов. Координаты не задаются вручную:
# каждый новый seed получает своё случайное расположение.
additional-islands:
  count-min: 10
  count-max: 20
  radius-min: 15
  radius-max: 24
  height-min: 3
  height-max: 5
  variation: 0.7
  min-distance: 700
  max-distance: 6000
  islands: {}

vegetation:
  enabled: true
  attempts-per-chunk: 16
  tree-chance-percent: 22
  flower-chance-percent: 38

village:
  enabled: true
  offset-x: 0
  offset-z: 55

animals:
  enabled: true
  ocean-radius: 600

# ==========================================================
# Восстановление разрушенного рельефа
# ==========================================================
restore:
  # Радиус команды /wwrestore без аргумента.
  radius: 32
  # Максимальный разрешённый радиус команды.
  max-radius: 64
  # Сохранять историю между перезапусками сервера.
  persistent: true

# Руды генерируются отдельной системой WaterWorld в Stone и Deepslate.
