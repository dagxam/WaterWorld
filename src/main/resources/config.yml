# ==========================================================
# WaterWorld — главный остров + автономные малые острова
# ==========================================================

world:
  name: waterworld

sea-level: 63

time-cycle:
  enabled: false
  day-duration-seconds: 1200
  night-duration-seconds: 600
  update-interval-ticks: 1

ocean:
  base-height: 35
  height-amplitude: 3
  terrain-scale: 0.004

ocean-life:
  enabled: true
  plant-attempts-per-chunk: 44
  reef-chance-percent: 42
  ruin-chance-percent: 9
  shipwreck-chance-percent: 4

island:
  enabled: true
  center-x: 0
  center-z: 0
  radius: 100
  height: 9
  variation: 1.2
  noise-scale: 0.035
  biome: PLAINS
  mountain:
    enabled: false
  central-hill:
    height: 7
    radius: 48
    offset-x: 0
    offset-z: -12

# ==========================================================
# Автономные малые острова
#
# Остров не создаётся заранее в общем списке.
# Пространство разбито на ячейки. При генерации чанка
# координаты ячейки + seed однозначно определяют, есть
# ли в ней остров и каким он будет.
#
# Поэтому порядок загрузки чанков не влияет на мир:
# подошёл сейчас — остров появился;
# ушёл и чанк выгрузился — при следующей загрузке
# тот же самый остров будет на том же месте.
# ==========================================================
additional-islands:
  enabled: true

  # 16x16 чанков = 256x256 блоков на ячейку.
  cell-size-chunks: 16

  # Шанс острова на одну ячейку.
  spawn-chance: 0.12

  # Минимальная дистанция между центрами островов.
  # Она намного больше размеров островов, поэтому острова
  # не превращаются в группу стоящих вплотную островков.
  min-distance: 700

  # Минимальная дистанция от центрального острова.
  min-distance-from-main: 700

  radius-min: 15
  radius-max: 24

  height-min: 3
  height-max: 5

  variation: 0.7

  # Сколько соседних ячеек учитывать при проверке конфликтов.
  neighbor-cells: 3

  # Каждый остров получает собственный биом.
  biomes:
    - PLAINS
    - FOREST
    - BIRCH_FOREST
    - TAIGA
    - JUNGLE
    - SAVANNA
    - DARK_FOREST
    - SWAMP
    - FLOWER_FOREST

vegetation:
  enabled: true
  attempts-per-chunk: 16
  tree-chance-percent: 22
  flower-chance-percent: 38

village:
  enabled: true
  offset-x: 0
  offset-z: 55

animals:
  enabled: true
  ocean-radius: 600

restore:
  radius: 32
  max-radius: 64
  persistent: true

# Руды WaterWorld не генерирует.
# Руды генерирует отдельный Ore Plugin.
