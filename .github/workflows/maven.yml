name: Сборка и Релиз Maven

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Скачивание репозитория
      uses: actions/checkout@v4

    - name: Установка Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Сборка проекта через Maven
      run: mvn -B clean package --file pom.xml

    - name: Сохранение скомпилированного плагина (Артефакт)
      uses: actions/upload-artifact@v4
      with:
        name: WaterWorld-Plugin
        path: target/WaterWorld-*.jar

    - name: Создание GitHub Релиза (только при создании тега)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        name: Релиз ${{ github.ref_name }}
        body: |
          Автоматическая сборка плагина **WaterWorld** от **dagxam**.
          
          ✅ Сборка успешно завершена. Плагин готов к работе на сервере.
          ⬇️ Скачайте готовый `.jar` файл в разделе **Assets** ниже.
        files: target/WaterWorld-*.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
